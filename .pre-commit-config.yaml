# B1-RU Pre-commit 配置
#
# 安装: pip install pre-commit && pre-commit install
# 来源: 承 CDD3 .pre-commit-config.yaml 模式裁剪（copy-ledger 登记）

default_language_version:
  python: python3.13

repos:
  # 通用检查
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key

  # Python 格式与静态检查（line-length=100 承 CDD3）
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        language_version: python3.13
        args: [--line-length=100]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=100]

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ['--max-line-length=100', '--extend-ignore=E203,W503']

  - repo: local
    hooks:
      # B1-RU 禁止模式检查（根 CLAUDE.md 检查清单的机器可执行子集）
      - id: b1-banned-patterns
        name: 🚫 B1-RU 禁止模式检查
        entry: bash scripts/ci/check-banned-patterns.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # 文档规范（H4：frontmatter + 更新日期；命名/死链后置）
      - id: doc-frontmatter-check
        name: 📋 文档元数据检查
        entry: bash scripts/ci/doc-check-frontmatter.sh
        language: system
        files: ^docs/(engineering|knowledge)/.*\.md$
        stages: [pre-commit]

      - id: doc-updated-check
        name: 📋 文档更新日期检查
        entry: bash scripts/ci/doc-check-updated.sh
        language: system
        files: ^docs/(engineering|knowledge)/.*\.md$
        stages: [pre-commit]
