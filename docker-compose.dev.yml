# B1-RU 本地开发编排（开发用；客户交付单元在 deploy/）
# 来源: 承 CDD3 docker-compose.dev.yml 模式
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: b1ru
      POSTGRES_USER: b1ru
      POSTGRES_PASSWORD: b1ru_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U b1ru"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgres://b1ru:b1ru_dev@db:5432/b1ru
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
