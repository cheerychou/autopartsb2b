openapi: 3.0.3
info:
  title: B1-RU API
  version: v1
paths:
  /api/v1/auth/token:
    post:
      operationId: api_v1_auth_token_create
      description: 管理端登录：凭据有效但无管理角色 → 403（买家账号走 storefront 登录，两不混淆）。
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/token/refresh:
    post:
      operationId: api_v1_auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/batches/:
    post:
      operationId: api_v1_batches_create
      description: 创建进口批次（贴标工作台第一步；F-16）。
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchInRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BatchInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BatchInRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/batches/{batch_no}/codes/:
    post:
      operationId: api_v1_batches_codes_create
      description: |-
        F-16 贴标工作台：批次码清单导入（ЧЗ 导出/Excel 粘贴的码值列表）。

        支持从中国远程调用（25号§一.5：贴标在中国侧、核销在俄境）。
      parameters:
      - in: path
        name: batch_no
        schema:
          type: string
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeListInRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CodeListInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CodeListInRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/batches/{batch_no}/customs-export/:
    get:
      operationId: api_v1_batches_customs_export_retrieve
      description: |-
        F-16 报关清单导出（CSV，UTF-8 BOM）：批次逐码申报明细（25号§一.5）。

        工作流=报关前贴码并在报关单申报（2026-12-01 起），清单供报关申报与贴码
        核对——导出批次**全部码**（不筛状态，状态列供核对）。零依赖 CSV（无 xlsx
        库），BOM 使 Excel 直开。
      parameters:
      - in: path
        name: batch_no
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/batches/{batch_no}/print-list/:
    get:
      operationId: api_v1_batches_print_list_retrieve
      description: F-16 打印清单导出：批次内已贴码清单（DataMatrix 内容+GTIN，供标签打印）。
      parameters:
      - in: path
        name: batch_no
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/batches/{batch_no}/receive/:
    post:
      operationId: api_v1_batches_receive_create
      description: 收货验码（labelled→in_stock，同步库存入账）；可选按码精确验收。
      parameters:
      - in: path
        name: batch_no
        schema:
          type: string
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiveRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReceiveRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReceiveRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/batches/list/:
    get:
      operationId: api_v1_batches_list_retrieve
      description: 批次列表（贴标工作台；新→旧，含在库码计数）。
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/buyer-accounts/:
    get:
      operationId: api_v1_buyer_accounts_list
      description: F-15 客户管理：企业注册审核（approve/reject @action）+ 待审核队列。
      parameters:
      - in: query
        name: buyer_type
        schema:
          type: string
          enum:
          - corporate
          - individual
        description: |-
          * `individual` - 个人客户
          * `corporate` - 企业客户
      - name: page
        required: false
        in: query
        description: 分页结果集中的页码。
        schema:
          type: integer
      - in: query
        name: verification_status
        schema:
          type: string
          title: 认证状态
          enum:
          - approved
          - pending
          - rejected
        description: |-
          仅 corporate 有效；individual 恒 approved

          * `pending` - 待审核
          * `approved` - 已认证
          * `rejected` - 已驳回
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBuyerAccountList'
          description: ''
  /api/v1/buyer-accounts/{id}/:
    get:
      operationId: api_v1_buyer_accounts_retrieve
      description: F-15 客户管理：企业注册审核（approve/reject @action）+ 待审核队列。
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 标识此 buyer account 的 唯一整数值。
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerAccount'
          description: ''
  /api/v1/buyer-accounts/{id}/approve/:
    post:
      operationId: api_v1_buyer_accounts_approve_create
      description: F-15 客户管理：企业注册审核（approve/reject @action）+ 待审核队列。
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 标识此 buyer account 的 唯一整数值。
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerAccount'
          description: ''
  /api/v1/buyer-accounts/{id}/reject/:
    post:
      operationId: api_v1_buyer_accounts_reject_create
      description: F-15 客户管理：企业注册审核（approve/reject @action）+ 待审核队列。
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 标识此 buyer account 的 唯一整数值。
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerAccount'
          description: ''
  /api/v1/codes/aging/:
    get:
      operationId: api_v1_codes_aging_retrieve
      description: 码报表：在库码数 + 批次账龄分桶（25号§2.6）。
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/codes/outbound/:
    post:
      operationId: api_v1_codes_outbound_create
      description: 按码出库（in_stock→outbound，销售核销；库存同步扣减）。
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboundRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OutboundRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OutboundRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/codes/return/:
    post:
      operationId: api_v1_codes_return_create
      description: 退货回转（outbound→returned→in_stock 重新入转；库存同步回补）。
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReturnRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReturnRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/inventory/:
    get:
      operationId: api_v1_inventory_list
      description: F-12 库存：余额查询 + 出入库记账（@action）。
      parameters:
      - name: page
        required: false
        in: query
        description: 分页结果集中的页码。
        schema:
          type: integer
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInventoryItemList'
          description: ''
  /api/v1/inventory/{id}/:
    get:
      operationId: api_v1_inventory_retrieve
      description: F-12 库存：余额查询 + 出入库记账（@action）。
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 标识此 inventory item 的 唯一整数值。
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItem'
          description: ''
  /api/v1/inventory/{id}/transactions/:
    post:
      operationId: api_v1_inventory_transactions_create
      description: F-12 库存：余额查询 + 出入库记账（@action）。
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 标识此 inventory item 的 唯一整数值。
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TxInRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TxInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TxInRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItem'
          description: ''
  /api/v1/orders/:
    get:
      operationId: api_v1_orders_list
      description: 管理端订单查询（F-13 履约 / F-14 核销的入口列表；写操作仍走专端点）。
      parameters:
      - name: page
        required: false
        in: query
        description: 分页结果集中的页码。
        schema:
          type: integer
      - in: query
        name: payment_method
        schema:
          type: string
          enum:
          - bank_transfer
          - online
        description: |-
          * `bank_transfer` - 对公转账
          * `online` - 在线收单
      - in: query
        name: status
        schema:
          type: string
          enum:
          - awaiting_confirmation
          - cancelled
          - completed
          - paid
          - pending_payment
          - shipped
        description: |-
          * `pending_payment` - 待付款
          * `awaiting_confirmation` - 待确认到账
          * `paid` - 已付款
          * `shipped` - 已发货
          * `completed` - 已完成
          * `cancelled` - 已取消
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrderAdminList'
          description: ''
  /api/v1/orders/{order_id}/confirm-payment/:
    post:
      operationId: api_v1_orders_confirm_payment_create
      description: |-
        F-14 对公到账人工确认核销（awaiting_confirmation→paid）。

        高危域：金额必须与订单总额一致；重复核销报错；confirmed_by 留痕。
      parameters:
      - in: path
        name: order_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPaymentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConfirmPaymentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConfirmPaymentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/orders/{order_id}/ship/:
    post:
      operationId: api_v1_orders_ship_create
      description: F-13 发货（paid→shipped）+ 物流单号录入。
      parameters:
      - in: path
        name: order_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ShipRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ShipRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/orders/{order_id}/:
    get:
      operationId: api_v1_orders_retrieve
      description: 管理端订单查询（F-13 履约 / F-14 核销的入口列表；写操作仍走专端点）。
      parameters:
      - in: path
        name: order_id
        schema:
          type: string
          format: uuid
        description: 标识此 order 的 UUID 字符串。
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderAdmin'
          description: ''
  /api/v1/payments/:
    get:
      operationId: api_v1_payments_retrieve
      description: F-14 收单流水列表（ENG-003 缺口①）：已核销订单的到账记录派生视图。
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/pricing/deactivate-expired/:
    post:
      operationId: api_v1_pricing_deactivate_expired_create
      description: F-11 手动触发批量下价（定时任务 deploy/ 接线前的手动位）。
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/products/:
    get:
      operationId: api_v1_products_list
      description: F-10 商品管理：I2 组商品（创建）→ 编辑 → 上架。
      parameters:
      - name: page
        required: false
        in: query
        description: 分页结果集中的页码。
        schema:
          type: integer
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductList'
          description: ''
    post:
      operationId: api_v1_products_create
      description: F-10 商品管理：I2 组商品（创建）→ 编辑 → 上架。
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductWrite'
          description: ''
  /api/v1/products/{product_id}/:
    get:
      operationId: api_v1_products_retrieve
      description: F-10 商品管理：I2 组商品（创建）→ 编辑 → 上架。
      parameters:
      - in: path
        name: product_id
        schema:
          type: string
          format: uuid
        description: 标识此 product 的 UUID 字符串。
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    put:
      operationId: api_v1_products_update
      description: F-10 商品管理：I2 组商品（创建）→ 编辑 → 上架。
      parameters:
      - in: path
        name: product_id
        schema:
          type: string
          format: uuid
        description: 标识此 product 的 UUID 字符串。
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    patch:
      operationId: api_v1_products_partial_update
      description: F-10 商品管理：I2 组商品（创建）→ 编辑 → 上架。
      parameters:
      - in: path
        name: product_id
        schema:
          type: string
          format: uuid
        description: 标识此 product 的 UUID 字符串。
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProductRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProductRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProductRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    delete:
      operationId: api_v1_products_destroy
      description: F-10 商品管理：I2 组商品（创建）→ 编辑 → 上架。
      parameters:
      - in: path
        name: product_id
        schema:
          type: string
          format: uuid
        description: 标识此 product 的 UUID 字符串。
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/products/{product_id}/relist/:
    post:
      operationId: api_v1_products_relist_create
      description: |-
        F-11 重挂（限时价到期后的唯一恢复路径）：重新定价 + 重启窗口 + 上架。

        走查 P1-1（2026-10-25）：此前 relist_with_new_price 无生产调用方、
        价格窗口字段序列化器只读 → 到期商品永久不可售。本端点补全闭环。
      parameters:
      - in: path
        name: product_id
        schema:
          type: string
          format: uuid
        description: 标识此 product 的 UUID 字符串。
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelistRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RelistRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RelistRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/v1/reports/catalog-coverage/:
    get:
      operationId: api_v1_reports_catalog_coverage_retrieve
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
