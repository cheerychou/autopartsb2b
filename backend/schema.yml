components:
  schemas:
    BatchInRequest:
      type: object
      properties:
        batch_no:
          type: string
          minLength: 1
          maxLength: 32
        customs_declaration:
          type: string
          default: ''
          maxLength: 64
      required:
      - batch_no
    BuyerAccount:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        buyer_type:
          $ref: '#/components/schemas/BuyerTypeEnum'
        phone:
          type: string
          title: 手机
          maxLength: 20
        company_name_ru:
          type: string
          title: 企业名称(俄)
          maxLength: 300
        inn:
          type: string
          title: ИНН
          description: 俄企税号
          maxLength: 12
        verification_status:
          allOf:
          - $ref: '#/components/schemas/VerificationStatusEnum'
          readOnly: true
          title: 认证状态
          description: |-
            仅 corporate 有效；individual 恒 approved

            * `pending` - 待审核
            * `approved` - 已认证
            * `rejected` - 已驳回
        verification_note:
          type: string
          readOnly: true
          title: 审核意见
        can_order:
          type: boolean
          readOnly: true
        verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: 审核时间
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - buyer_type
      - can_order
      - created_at
      - id
      - username
      - verification_note
      - verification_status
      - verified_at
    BuyerTypeEnum:
      enum:
      - individual
      - corporate
      type: string
      description: |-
        * `individual` - 个人客户
        * `corporate` - 企业客户
    CartRemoveRequest:
      type: object
      properties:
        product_id:
          type: string
          format: uuid
      required:
      - product_id
    CheckoutPaymentMethodEnum:
      enum:
      - bank_transfer
      type: string
      description: '* `bank_transfer` - bank_transfer'
    CheckoutRequest:
      type: object
      properties:
        shipping_address:
          type: string
          minLength: 1
          maxLength: 500
        payment_method:
          $ref: '#/components/schemas/CheckoutPaymentMethodEnum'
      required:
      - payment_method
      - shipping_address
    CodeListInRequest:
      type: object
      properties:
        product_id:
          type: string
          format: uuid
        gtin:
          type: string
          default: ''
          maxLength: 14
        code_values:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
      required:
      - code_values
      - product_id
    ConfirmPaymentRequest:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        note:
          type: string
          default: ''
          maxLength: 200
      required:
      - amount
    DecisionRequest:
      type: object
      properties:
        note:
          type: string
          default: ''
          maxLength: 200
    InventoryItem:
      type: object
      properties:
        product:
          type: string
          format: uuid
        product_code:
          type: string
          readOnly: true
        quantity_available:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          title: 可售数量
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - product
      - product_code
      - updated_at
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    OrderAdmin:
      type: object
      description: 管理端订单列表/详情（F-13/14 的工作集）；行项一并带出。
      properties:
        order_id:
          type: string
          format: uuid
          readOnly: true
        order_no:
          type: string
          title: 订单号
          maxLength: 16
        buyer:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        payment_method:
          $ref: '#/components/schemas/OrderAdminPaymentMethodEnum'
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          title: 订单总额(₽)
        shipping_address:
          type: string
          title: 收货地址
        tracking_no:
          type: string
          title: 物流单号
          maxLength: 64
        carrier:
          type: string
          title: 承运商
          maxLength: 32
        payment_confirmed_at:
          type: string
          format: date-time
          nullable: true
          title: 核销时间
        created_at:
          type: string
          format: date-time
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemBrief'
          readOnly: true
      required:
      - buyer
      - created_at
      - items
      - order_id
      - order_no
      - payment_method
      - shipping_address
      - total_amount
    OrderAdminPaymentMethodEnum:
      enum:
      - bank_transfer
      - online
      type: string
      description: |-
        * `bank_transfer` - 对公转账
        * `online` - 在线收单
    OrderItemBrief:
      type: object
      properties:
        title_ru:
          type: string
          title: 俄语标题（快照）
          maxLength: 300
        quantity:
          type: integer
          maximum: 2147483647
          minimum: 0
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          title: 成交单价(₽)
        line_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          title: 行金额(₽)
      required:
      - line_amount
      - quantity
      - title_ru
      - unit_price
    OutboundRequest:
      type: object
      properties:
        product_id:
          type: string
          format: uuid
        code_values:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
        order_id:
          type: string
          format: uuid
      required:
      - code_values
      - product_id
