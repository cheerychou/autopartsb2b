      description: 创建入参：catalog_spu_id + title_ru + price_amount；目录校验在服务层（I2-2）。
      properties:
        product_id:
          type: string
          format: uuid
          readOnly: true
        product_code:
          type: string
          readOnly: true
          title: 商品编码
        catalog_spu_id:
          type: string
          format: uuid
        catalog_version_at_listing:
          type: string
          readOnly: true
          title: 上架时的数据包版本
          description: 选件回填时点的 catalog_version，供追溯（软引用不锁定历史版本）
        title_ru:
          type: string
          title: 俄语标题
          maxLength: 300
        description_ru:
          type: string
          title: 俄语详情
        price_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          title: 限时价(₽)
        price_starts_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: 价格生效
        price_expires_at:
          type: string
          format: date-time
          readOnly: true
          title: 价格到期（30 天限时价）
        gtin:
          type: string
          maxLength: 14
        harmonized_code:
          type: string
          title: HS编码(ТН ВЭД)
          maxLength: 15
        is_listed:
          type: boolean
          title: 上架
        listed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: 上架时间
      required:
      - catalog_spu_id
      - catalog_version_at_listing
      - listed_at
      - price_amount
      - price_expires_at
      - price_starts_at
      - product_code
      - product_id
      - title_ru
    ProductWriteRequest:
      type: object
      description: 创建入参：catalog_spu_id + title_ru + price_amount；目录校验在服务层（I2-2）。
      properties:
        catalog_spu_id:
          type: string
          format: uuid
        title_ru:
          type: string
          minLength: 1
          title: 俄语标题
          maxLength: 300
        description_ru:
          type: string
          title: 俄语详情
        price_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          title: 限时价(₽)
        gtin:
          type: string
          maxLength: 14
        harmonized_code:
          type: string
          title: HS编码(ТН ВЭД)
          maxLength: 15
        is_listed:
          type: boolean
          title: 上架
        price_days:
          type: integer
          maximum: 90
          minimum: 1
          writeOnly: true
          default: 30
      required:
      - catalog_spu_id
      - price_amount
      - title_ru
    ReceiveRequest:
      type: object
      properties:
        code_values:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
    RegisterRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 4
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 8
        phone:
          type: string
          default: ''
          maxLength: 20
        buyer_type:
          $ref: '#/components/schemas/BuyerTypeEnum'
        company_name_ru:
          type: string
          default: ''
          maxLength: 300
        inn:
          type: string
          default: ''
          maxLength: 12
      required:
      - buyer_type
      - password
      - username
    RelistRequest:
      type: object
      description: F-11 重挂入参：新价格 + 新窗口天数（窗口重启，调价历史留在 OrderItem 快照）。
      properties:
        price_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        price_days:
          type: integer
          maximum: 90
          minimum: 1
          default: 30
      required:
      - price_amount
    ReturnRequest:
      type: object
      properties:
        code_values:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
      required:
      - code_values
    ShipRequest:
      type: object
      properties:
        tracking_no:
          type: string
          minLength: 1
          maxLength: 64
        carrier:
          type: string
          default: ''
          maxLength: 32
      required:
      - tracking_no
    StatusEnum:
      enum:
      - pending_payment
      - awaiting_confirmation
      - paid
      - shipped
      - completed
      - cancelled
      type: string
      description: |-
        * `pending_payment` - 待付款
        * `awaiting_confirmation` - 待确认到账
        * `paid` - 已付款
        * `shipped` - 已发货
        * `completed` - 已完成
        * `cancelled` - 已取消
    TokenObtainPair:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    TokenObtainPairRequest:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
      required:
      - access
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - refresh
    TxInRequest:
      type: object
      properties:
        tx_type:
          $ref: '#/components/schemas/TxTypeEnum'
        quantity:
          type: integer
        note:
          type: string
          default: ''
          maxLength: 200
      required:
      - quantity
      - tx_type
    TxTypeEnum:
      enum:
      - inbound
      - outbound
      - adjust
      type: string
      description: |-
        * `inbound` - 入库
        * `outbound` - 出库
        * `adjust` - 调整
    VerificationStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      type: string
      description: |-
        * `pending` - 待审核
        * `approved` - 已认证
        * `rejected` - 已驳回
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
