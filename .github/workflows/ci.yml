name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  banned-patterns:
    name: 禁止模式检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 扫描禁止模式
        run: bash scripts/ci/check-banned-patterns.sh

  backend:
    name: 后端（lint + test + coverage）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: 安装依赖
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint（black/isort/flake8）
        run: |
          black --check --line-length=100 .
          isort --check-only --profile=black --line-length=100 .
          flake8 --max-line-length=100 --extend-ignore=E203,W503 .
      - name: 类型检查（mypy core）
        run: mypy catalog commerce shared config
      - name: 测试（含 coverage 基线；封闭 SQLite 档=本地 make test-backend 同口径）
        run: |
          export B1RU_TEST_SQLITE=1 B1RU_AUTH_THROTTLE_RATE=10000/min
          pytest --cov=catalog --cov=commerce --cov=shared --cov-report=term
      # coverage-baseline 校验随 S1 接入（首批代码落库后定基线）

  frontend:
    name: 前端（lint + type-check + test）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: Lint + 类型检查 + 测试（两应用）
        run: |
          pnpm -r lint
          pnpm -r type-check
          pnpm -r test:run

  docs:
    name: 文档规范
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: frontmatter 检查（全量）
        run: |
          fail=0
          for f in docs/engineering/*.md docs/knowledge/*.md; do
            [ -f "$f" ] || continue
            for field in doc_id title updated_at; do
              head -10 "$f" | grep -qE "^${field}:" || { echo "🚫 $f 缺 $field"; fail=1; }
            done
          done
          exit $fail

  e2e:
    name: e2e（跨端 UI 业务链，Playwright）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装后端依赖
        run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: backend
      - name: 起后端 :8001（SQLite + 演示数据，同 e2e/README.md 起栈清单）
        run: |
          export B1RU_TEST_SQLITE=1 B1RU_AUTH_THROTTLE_RATE=10000/min
          python manage.py migrate
          python manage.py import_seed_package --package ../deploy/demo/B1RU-CAT-DEMO-INIT-0001.zip
          python manage.py import_seed_package --package ../deploy/demo/B1RU-CAT-DEMO-DELTA-0002.zip
          python manage.py seed_demo_commerce
          DJANGO_SUPERUSER_USERNAME=b1owner DJANGO_SUPERUSER_EMAIL=ops@b1ru.local \
            DJANGO_SUPERUSER_PASSWORD='Demo-Owner-2026!' python manage.py createsuperuser --noinput
          python manage.py init_rbac --assign b1owner:owner
          nohup python manage.py runserver 127.0.0.1:8001 &>/tmp/backend.log &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8001/api/health/ >/dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:8001/api/health/ || { echo "后端未就绪"; tail /tmp/backend.log; exit 1; }
        working-directory: backend
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: 起两端 dev（:5174 storefront / :5175 admin）
        run: |
          nohup env B1RU_API_TARGET=http://localhost:8001 pnpm --filter storefront-web dev &>/tmp/store.log &
          nohup env B1RU_API_TARGET=http://localhost:8001 pnpm --filter admin-web dev &>/tmp/admin.log &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5174/ >/dev/null && curl -sf http://localhost:5175/ >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:5174/ >/dev/null || { echo "storefront 未就绪"; tail /tmp/store.log; exit 1; }
          curl -sf http://localhost:5175/ >/dev/null || { echo "admin 未就绪"; tail /tmp/admin.log; exit 1; }
        working-directory: frontend
      - name: Playwright 浏览器（chromium + 系统依赖）
        run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend/e2e
      - name: 跑 e2e（5 例，workers=1 串行）
        run: pnpm test
        working-directory: frontend/e2e
      - name: 失败时上传报告（截图/trace）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/e2e/playwright-report/
          retention-days: 7
